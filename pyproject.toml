[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfetcher"
dynamic = ["version"]
description = "Multi-agent LLM orchestration framework"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    {name = "LunaticLegacy"},
]
dependencies = [
    "openai==2.54.0",
    "anthropic==1.8.0",
    "litellm==1.100.3",
    "markdown-it-py==4.2.0",
    "networkx==3.7",
]

[project.scripts]
llmfetcher = "llmfetcher.cli:main"

[tool.setuptools]
package-dir = {llmfetcher = "."}
packages = [
    "llmfetcher",
    "llmfetcher.context_handlers",
    "llmfetcher.execution",
    "llmfetcher.fetcher_handlers",
    "llmfetcher.graph_memory",
    "llmfetcher.memory",
    "llmfetcher.rag_module",
    "llmfetcher.rag_module.knowledge",
    "llmfetcher.rag_module_tlb",
    "llmfetcher.swarm_module",
    "llmfetcher.tools",
]

[tool.setuptools.dynamic]
version = {attr = "llmfetcher._version.__version__"}
