[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfetcher"
dynamic = ["version"]
description = "Multi-agent LLM orchestration framework"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    {name = "LunaticLegacy"},
]
dependencies = [
    "openai>=1.0.0",
    "anthropic==1.8.0",
    "litellm>=1.0.0",
    "markdown-it-py",
    "networkx",
]

[project.scripts]
llmfetcher = "llmfetcher.cli:main"

[tool.setuptools]
package-dir = {llmfetcher = "."}
packages = [
    "llmfetcher",
    "llmfetcher.agent",
    "llmfetcher.context_handlers",
    "llmfetcher.context_handlers.linear",
    "llmfetcher.context_handlers.sage",
    "llmfetcher.execution",
    "llmfetcher.fetcher_handlers",
    "llmfetcher.graph_memory",
    "llmfetcher.llm_types",
    "llmfetcher.memory",
    "llmfetcher.rag_module",
    "llmfetcher.rag_module.knowledge",
    "llmfetcher.rag_module_tlb",
    "llmfetcher.swarm_module",
    "llmfetcher.swarm_module.execution_graph",
    "llmfetcher.tools",
]

[tool.setuptools.dynamic]
version = {attr = "llmfetcher._version.__version__"}
